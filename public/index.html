<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA 3D - العالم المفتوح</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #game-container { width: 100vw; height: 100vh; display: block; }
        
        /* واجهة المستخدم HUD */
        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            text-align: right;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .money { font-size: 28px; font-weight: bold; color: #2ecc71; margin-bottom: 5px; }
        .wanted { font-size: 26px; letter-spacing: 3px; margin-bottom: 10px; }
        .star-active { color: #f1c40f; text-shadow: 0 0 10px #e67e22; }
        .star-inactive { color: rgba(255,255,255,0.3); }
        
        .bars { width: 200px; float: left; }
        .bar-bg { width: 100%; height: 12px; background: rgba(0,0,0,0.6); border: 1px solid #fff; margin-bottom: 5px; }
        .health-fill { width: 100%; height: 100%; background: #e74c3c; transition: width 0.2s; }
        .armor-fill { width: 100%; height: 100%; background: #3498db; }

        /* التعليمات */
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            border-right: 4px solid #f1c40f;
            font-size: 14px;
            line-height: 1.6;
            pointer-events: none;
        }

        /* إشعارات اللعب */
        #notification {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #f1c40f;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        /* شاشة البداية */
        #start-screen {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(20,20,30,0.95));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        #start-screen h1 {
            font-size: 60px;
            color: #f1c40f;
            text-shadow: 4px 4px 0px #c0392b;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        #start-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            background: #2ecc71;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        #start-btn:hover { transform: scale(1.05); background: #27ae60; }

        /* عداد السرعة */
        #speedometer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>GRAND CITY 3D</h1>
        <p>تجربة عالم مفتوح ثلاثية الأبعاد</p>
        <button id="start-btn">ابدأ اللعب</button>
    </div>

    <div id="hud">
        <div class="money" id="money-display">$00001500</div>
        <div class="wanted" id="wanted-display">
            <span class="star-inactive">★</span><span class="star-inactive">★</span><span class="star-inactive">★</span><span class="star-inactive">★</span><span class="star-inactive">★</span>
        </div>
        <div class="bars">
            <div class="bar-bg"><div class="health-fill" id="health-bar"></div></div>
            <div class="bar-bg"><div class="armor-fill" id="armor-bar"></div></div>
        </div>
    </div>

    <div id="notification">اضغط F لركوب السيارة</div>
    <div id="speedometer">0 KM/H</div>

    <div id="controls">
        <b>التحكم:</b><br>
        [W, A, S, D] أو [الأسهم] : الحركة / القيادة<br>
        [Shift] : ركض سريع (على الأقدام)<br>
        [Space] : قفز / فرامل يدوية (Drift)<br>
        [F] : ركوب أو النزول من السيارة<br>
        [Mouse] : تحريك الكاميرا
    </div>

    <div id="game-container"></div>

    <!-- استدعاء مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- إعدادات اللعبة والمتغيرات الأساسية ---
        let scene, camera, renderer;
        let player, playerVelocity = new THREE.Vector3();
        let isOnGround = true;
        let inCar = false;
        let currentCar = null;
        let cars = [];
        let policeCars = [];
        let buildings = []; // للتصادم
        let moneyPickups = [];
        
        let money = 1500;
        let wantedLevel = 0;
        let health = 100;
        
        // مدخلات التحكم
        const keys = {};
        let cameraAngleX = 0;
        let cameraAngleY = 0.3;
        let isMouseDown = false;

        // تهيئة المشهد
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // لون السماء
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.0025);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // الإضاءة
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 200, 100);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 200;
            dirLight.shadow.camera.bottom = -200;
            dirLight.shadow.camera.left = -200;
            dirLight.shadow.camera.right = 200;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            buildCity();
            createPlayer();
            spawnCars();
            spawnMoney();

            // أحداث لوحة المفاتيح والماوس
            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code === 'KeyF') toggleCar();
            });
            window.addEventListener('keyup', (e) => keys[e.code] = false);
            
            window.addEventListener('mousedown', () => isMouseDown = true);
            window.addEventListener('mouseup', () => isMouseDown = false);
            window.addEventListener('mousemove', (e) => {
                if (isMouseDown || document.pointerLockElement === renderer.domElement) {
                    cameraAngleX -= e.movementX * 0.005;
                    cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2.2, cameraAngleY + e.movementY * 0.005));
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('start-screen').style.display = 'none';
                renderer.domElement.requestPointerLock();
                animate();
            });
        }

        // --- بناء المدينة ---
        function buildCity() {
            // الأرضية (الإسفلت)
            const groundGeo = new THREE.PlaneGeometry(1000, 1000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // شبكة الشوارع والمباني
            const blockSize = 60;
            const streetWidth = 20;
            const gridCount = 6;

            const buildingColors = [0x95a5a6, 0x7f8c8d, 0xbdc3c7, 0xd35400, 0x2980b9, 0x8e44ad, 0x34495e];

            for (let x = -gridCount; x <= gridCount; x++) {
                for (let z = -gridCount; z <= gridCount; z++) {
                    const posX = x * (blockSize + streetWidth);
                    const posZ = z * (blockSize + streetWidth);

                    // الرصيف
                    const sidewalkGeo = new THREE.BoxGeometry(blockSize, 0.5, blockSize);
                    const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x95a5a6 });
                    const sidewalk = new THREE.Mesh(sidewalkGeo, sidewalkMat);
                    sidewalk.position.set(posX, 0.25, posZ);
                    sidewalk.receiveShadow = true;
                    scene.add(sidewalk);

                    // خطوط الشارع البيضاء
                    const lineGeo = new THREE.PlaneGeometry(2, 10);
                    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    const line1 = new THREE.Mesh(lineGeo, lineMat);
                    line1.rotation.x = -Math.PI / 2;
                    line1.position.set(posX + blockSize/2 + streetWidth/2, 0.05, posZ);
                    scene.add(line1);

                    // ترك مساحة فارغة في المنتصف كبداية للاعب
                    if (x === 0 && z === 0) continue;

                    // إنشاء مباني عشوائية داخل المربع السكني
                    const bWidth = blockSize - 10;
                    const bDepth = blockSize - 10;
                    const bHeight = Math.random() * 60 + 20;
                    const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];

                    const bGeo = new THREE.BoxGeometry(bWidth, bHeight, bDepth);
                    const bMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
                    const building = new THREE.Mesh(bGeo, bMat);
                    building.position.set(posX, bHeight / 2 + 0.5, posZ);
                    building.castShadow = true;
                    building.receiveShadow = true;
                    scene.add(building);

                    // إضافة نوافذ مضيئة للمبنى
                    addWindows(building, bWidth, bHeight, bDepth);

                    // حفظ إحداثيات المبنى للتصادم
                    buildings.push({
                        minX: posX - bWidth / 2,
                        maxX: posX + bWidth / 2,
                        minZ: posZ - bDepth / 2,
                        maxZ: posZ + bDepth / 2
                    });
                }
            }
        }

        function addWindows(building, w, h, d) {
            const winMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });
            const winGeo = new THREE.PlaneGeometry(2, 3);
            for (let y = 5; y < h - 5; y += 8) {
                for (let x = -w/2 + 5; x < w/2 - 5; x += 6) {
                    if (Math.random() > 0.4) {
                        const win = new THREE.Mesh(winGeo, winMat);
                        win.position.set(x, y - h/2, d/2 + 0.1);
                        building.add(win);
                    }
                }
            }
        }

        // --- إنشاء الشخصية ---
        function createPlayer() {
            player = new THREE.Group();

            // الجسم
            const bodyGeo = new THREE.BoxGeometry(1.2, 1.8, 0.6);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71 }); // قميص أخضر (أسلوب Grove Street)
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 2.1;
            body.castShadow = true;
            player.add(body);

            // الرأس
            const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xd3a17e });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 3.5;
            head.castShadow = true;
            player.add(head);

            // الأرجل
            const legGeo = new THREE.BoxGeometry(0.5, 1.2, 0.5);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x2980b9 }); // بنطال جينز
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.35, 0.6, 0);
            player.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.35, 0.6, 0);
            player.add(rightLeg);

            player.position.set(0, 0, 15);
            scene.add(player);
        }

        // --- إنشاء السيارات ---
        function createCarMesh(color, isPolice = false) {
            const car = new THREE.Group();

            // هيكل السيارة السفلي
            const chassisGeo = new THREE.BoxGeometry(3.2, 1.2, 6.5);
            const chassisMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.6, roughness: 0.2 });
            const chassis = new THREE.Mesh(chassisGeo, chassisMat);
            chassis.position.y = 1.1;
            chassis.castShadow = true;
            car.add(chassis);

            // المقصورة العلوية
            const cabinGeo = new THREE.BoxGeometry(2.6, 1.0, 3.5);
            const cabinMat = new THREE.MeshStandardMaterial({ color: isPolice ? 0xffffff : 0x111111, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 2.1, -0.3);
            cabin.castShadow = true;
            car.add(cabin);

            // العجلات
            const wheelGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.5, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const wheelPositions = [
                [-1.7, 0.6, 2], [1.7, 0.6, 2],
                [-1.7, 0.6, -2], [1.7, 0.6, -2]
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                car.add(wheel);
            });

            // أضواء الشرطة إذا كانت سيارة شرطة
            if (isPolice) {
                const sirenBase = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.2, 0.4), new THREE.MeshBasicMaterial({ color: 0x333333 }));
                sirenBase.position.set(0, 2.7, -0.3);
                car.add(sirenBase);

                const redLight = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.25, 0.4), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
                redLight.position.set(-0.4, 2.75, -0.3);
                car.add(redLight);

                const blueLight = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.25, 0.4), new THREE.MeshBasicMaterial({ color: 0x0000ff }));
                blueLight.position.set(0.4, 2.75, -0.3);
                car.add(blueLight);

                car.userData.redLight = redLight;
                car.userData.blueLight = blueLight;
            }

            return car;
        }

        function spawnCars() {
            const carColors = [0xe74c3c, 0xf1c40f, 0x3498db, 0x9b59b6, 0xe67e22, 0xffffff];
            const positions = [
                [0, 0, 0], [40, 0, 20], [-40, 0, -20], [80, 0, 0], [-80, 0, 40], [0, 0, -80]
            ];

            positions.forEach((pos, idx) => {
                const mesh = createCarMesh(carColors[idx % carColors.length]);
                mesh.position.set(...pos);
                scene.add(mesh);
                cars.push({
                    mesh: mesh,
                    speed: 0,
                    maxSpeed: 1.8,
                    acceleration: 0.04,
                    steering: 0,
                    isPolice: false
                });
            });
        }

        // استدعاء الشرطة عند ارتفاع مستوى المطلوبين
        function spawnPoliceCar() {
            if (policeCars.length >= wantedLevel) return;
            const mesh = createCarMesh(0x111111, true);
            const angle = Math.random() * Math.PI * 2;
            const targetPos = inCar ? currentCar.mesh.position : player.position;
            mesh.position.set(targetPos.x + Math.cos(angle) * 70, 0, targetPos.z + Math.sin(angle) * 70);
            scene.add(mesh);
            
            const policeObj = {
                mesh: mesh,
                speed: 0,
                maxSpeed: 1.5,
                isPolice: true
            };
            policeCars.push(policeObj);
            cars.push(policeObj);
        }

        // --- المال القابل للجمع ---
        function spawnMoney() {
            const geo = new THREE.BoxGeometry(1.2, 0.6, 0.8);
            const mat = new THREE.MeshBasicMaterial({ color: 0x2ecc71 });
            for (let i = 0; i < 30; i++) {
                const m = new THREE.Mesh(geo, mat);
                m.position.set((Math.random() - 0.5) * 400, 1, (Math.random() - 0.5) * 400);
                scene.add(m);
                moneyPickups.push(m);
            }
        }

        // --- ركوب / النزول من السيارة ---
        function toggleCar() {
            if (inCar) {
                // النزول من السيارة
                inCar = false;
                player.visible = true;
                const exitOffset = new THREE.Vector3(-2.5, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), currentCar.mesh.rotation.y);
                player.position.copy(currentCar.mesh.position).add(exitOffset);
                player.position.y = 0;
                currentCar = null;
                document.getElementById('speedometer').style.display = 'none';
            } else {
                // البحث عن أقرب سيارة
                let closest = null;
                let minDist = 6;
                cars.forEach(car => {
                    const dist = player.position.distanceTo(car.mesh.position);
                    if (dist < minDist) {
                        minDist = dist;
                        closest = car;
                    }
                });

                if (closest) {
                    inCar = true;
                    currentCar = closest;
                    player.visible = false;
                    document.getElementById('speedometer').style.display = 'block';
                    
                    // سرقة سيارة شرطة ترفع النجوم فوراً!
                    if (closest.isPolice && wantedLevel < 2) {
                        increaseWanted(2);
                        showNotification("لقد سرقت سيارة شرطة! ★★");
                    } else if (wantedLevel === 0 && Math.random() > 0.5) {
                        increaseWanted(1);
                        showNotification("تم الإبلاغ عن سرقة سيارة! ★");
                    }
                }
            }
        }

        function increaseWanted(amount) {
            wantedLevel = Math.min(5, wantedLevel + amount);
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('money-display').innerText = '$' + money.toString().padStart(8, '0');
            const stars = document.getElementById('wanted-display').children;
            for (let i = 0; i < 5; i++) {
                stars[i].className = i < wantedLevel ? 'star-active' : 'star-inactive';
            }
        }

        function showNotification(text) {
            const notif = document.getElementById('notification');
            notif.innerText = text;
            notif.style.opacity = 1;
            setTimeout(() => notif.style.opacity = 0, 3000);
        }

        // --- فحص التصادم مع المباني ---
        function checkCollision(x, z, radius) {
            for (let b of buildings) {
                if (x + radius > b.minX && x - radius < b.maxX &&
                    z + radius > b.minZ && z - radius < b.maxZ) {
                    return true;
                }
            }
            return false;
        }

        // --- حلقة التحديث الرئيسية (Physics & AI) ---
        function update() {
            if (!inCar) {
                // --- حركة اللاعب على الأقدام ---
                const speed = keys['ShiftLeft'] ? 0.45 : 0.25;
                let moveX = 0;
                let moveZ = 0;

                if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

                if (moveX !== 0 || moveZ !== 0) {
                    const moveAngle = Math.atan2(moveX, moveZ) + cameraAngleX;
                    const nextX = player.position.x + Math.sin(moveAngle) * speed;
                    const nextZ = player.position.z + Math.cos(moveAngle) * speed;

                    if (!checkCollision(nextX, player.position.z, 0.8)) player.position.x = nextX;
                    if (!checkCollision(player.position.x, nextZ, 0.8)) player.position.z = nextZ;

                    player.rotation.y = moveAngle;
                }

                // القفز والجاذبية
                if (keys['Space'] && isOnGround) {
                    playerVelocity.y = 0.4;
                    isOnGround = false;
                }
                playerVelocity.y -= 0.02; // الجاذبية
                player.position.y += playerVelocity.y;

                if (player.position.y <= 0) {
                    player.position.y = 0;
                    playerVelocity.y = 0;
                    isOnGround = true;
                }

                // إظهار إشعار القرب من سيارة
                let nearCar = cars.some(c => player.position.distanceTo(c.mesh.position) < 6);
                const notif = document.getElementById('notification');
                if (nearCar && notif.innerText === "اضغط F لركوب السيارة") {
                    notif.style.opacity = 1;
                } else if (!nearCar && notif.innerText === "اضغط F لركوب السيارة") {
                    notif.style.opacity = 0;
                }

            } else {
                // --- قيادة السيارة ---
                const car = currentCar;
                if (keys['KeyW'] || keys['ArrowUp']) {
                    car.speed = Math.min(car.maxSpeed, car.speed + car.acceleration);
                } else if (keys['KeyS'] || keys['ArrowDown']) {
                    car.speed = Math.max(-car.maxSpeed / 2, car.speed - car.acceleration);
                } else {
                    // احتكاك طبيعي
                    car.speed *= 0.97;
                }

                // الفرامل اليدوية (Drift)
                if (keys['Space']) {
                    car.speed *= 0.92;
                }

                // التوجيه (يعمل فقط عندما تتحرك السيارة)
                if (Math.abs(car.speed) > 0.05) {
                    const turnSpeed = (keys['Space'] ? 0.06 : 0.04) * (car.speed > 0 ? 1 : -1);
                    if (keys['KeyA'] || keys['ArrowLeft']) car.mesh.rotation.y += turnSpeed;
                    if (keys['KeyD'] || keys['ArrowRight']) car.mesh.rotation.y -= turnSpeed;
                }

                const nextX = car.mesh.position.x + Math.sin(car.mesh.rotation.y) * car.speed;
                const nextZ = car.mesh.position.z + Math.cos(car.mesh.rotation.y) * car.speed;

                // تصادم السيارة مع المباني
                if (!checkCollision(nextX, car.mesh.position.z, 2.5)) {
                    car.mesh.position.x = nextX;
                } else {
                    car.speed = -car.speed * 0.5; // ارتداد عند الاصطدام
                }

                if (!checkCollision(car.mesh.position.x, nextZ, 2.5)) {
                    car.mesh.position.z = nextZ;
                } else {
                    car.speed = -car.speed * 0.5;
                }

                player.position.copy(car.mesh.position);
                document.getElementById('speedometer').innerText = Math.abs(Math.round(car.speed * 110)) + ' KM/H';
            }

            // --- ذكاء اصطناعي لمطاردة الشرطة ---
            if (wantedLevel > 0) {
                spawnPoliceCar();
                const targetPos = inCar ? currentCar.mesh.position : player.position;

                policeCars.forEach(pCar => {
                    if (pCar === currentCar) return; // إذا سرق اللاعب سيارة الشرطة نفسها

                    // وميض أضواء الشرطة
                    const time = Date.now() * 0.01;
                    pCar.mesh.userData.redLight.visible = Math.sin(time) > 0;
                    pCar.mesh.userData.blueLight.visible = Math.sin(time) <= 0;

                    // التوجه نحو اللاعب
                    const dx = targetPos.x - pCar.mesh.position.x;
                    const dz = targetPos.z - pCar.mesh.position.z;
                    const targetAngle = Math.atan2(dx, dz);
                    
                    pCar.mesh.rotation.y = targetAngle;
                    const nextX = pCar.mesh.position.x + Math.sin(targetAngle) * 0.9;
                    const nextZ = pCar.mesh.position.z + Math.cos(targetAngle) * 0.9;

                    if (!checkCollision(nextX, nextZ, 2.5)) {
                        pCar.mesh.position.set(nextX, 0, nextZ);
                    }

                    // اصطدام الشرطة باللاعب
                    if (pCar.mesh.position.distanceTo(targetPos) < 4.5) {
                        health = Math.max(0, health - 0.5);
                        document.getElementById('health-bar').style.width = health + '%';
                        if (health <= 0) {
                            alert("تم القبض عليك! (WASTED / BUSTED)");
                            location.reload();
                        }
                    }
                });
            }

            // --- جمع النقود ---
            const activePos = inCar ? currentCar.mesh.position : player.position;
            for (let i = moneyPickups.length - 1; i >= 0; i--) {
                const m = moneyPickups[i];
                m.rotation.y += 0.05;
                if (activePos.distanceTo(m.position) < 3.5) {
                    scene.remove(m);
                    moneyPickups.splice(i, 1);
                    money += 500;
                    updateHUD();
                }
            }

            // --- تحديث موقع الكاميرا (Third Person Camera) ---
            const target = inCar ? currentCar.mesh.position : player.position;
            const camDist = inCar ? 14 : 9;
            const camHeight = inCar ? 5 : 4;

            camera.position.x = target.x + Math.sin(cameraAngleX) * camDist * Math.cos(cameraAngleY);
            camera.position.z = target.z + Math.cos(cameraAngleX) * camDist * Math.cos(cameraAngleY);
            camera.position.y = target.y + camHeight + Math.sin(cameraAngleY) * camDist;
            
            camera.lookAt(target.x, target.y + 2, target.z);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        // بدء التهيئة
        init();
    </script>
</body>
</html>
